<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Artha — Voice Finance Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Mono:wght@300;400;500&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg:        #0f0f0f;
      --bg2:       #141410;
      --bg3:       #1a1a14;
      --bg4:       #222214;
      --bg5:       #2a2208;
      
      --accent:    #d4af37;
      --accent2:   #e8cc6a;
      --positive:  #4ecb71;
      --negative:  #ff5252;
      --warning:   #ff8c42;
      
      --text:      #f5f0e0;
      --text2:     #e8e0cc;
      --text3:     #8a7a50;
      
      --border:    rgba(212,175,55,.12);
      --border2:   rgba(212,175,55,.25);
      
      --radius:    12px;
      --radius-sm: 6px;
      --font:      'DM Mono', 'Courier New', monospace;
      
      --mono: 'DM Mono', monospace;
      --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
      --ease-out: cubic-bezier(.22, 1, .36, 1);
      --ease-in-out: cubic-bezier(.65, 0, .35, 1);
    }

    html,
    body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── NOISE OVERLAY ─── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
      opacity: .6;
    }

    /* ─── SCREENS ─── */
    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px) scale(.98);
      transition: opacity .45s var(--ease-out), transform .45s var(--ease-out);
      will-change: opacity, transform;
    }

    .screen.active {
      opacity: 1;
      pointer-events: all;
      transform: none;
    }

    .screen.exit {
      opacity: 0;
      transform: translateY(-12px) scale(.98);
    }

    /* ─── AMBIENT GRID ─── */
    .ambient {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .ambient-dot {
      position: absolute;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0;
      filter: blur(80px);
      transition: opacity 1.2s var(--ease-out);
    }

    .ambient-dot.a1 {
      width: 340px;
      height: 340px;
      top: -80px;
      right: -60px;
    }

    .ambient-dot.a2 {
      width: 280px;
      height: 280px;
      bottom: -60px;
      left: -40px;
    }

    .ambient-dot.active {
      opacity: .04;
    }

    /* ─── LANDING ─── */
    #landing {
      gap: 0;
      z-index: 1;
    }

    .landing-wordmark {
      font-size: 72px;
      font-weight: 700;
      letter-spacing: -.05em;
      line-height: 1;
      color: var(--accent);
      margin-bottom: 8px;
      position: relative;
    }

    .landing-wordmark::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), transparent);
      transform: scaleX(0);
      transform-origin: left;
      animation: underline-in 0.6s var(--ease-out) 0.4s forwards;
    }

    @keyframes underline-in {
      to {
        transform: scaleX(1);
      }
    }

    .landing-tagline {
      font-size: 13px;
      font-weight: 400;
      color: var(--text3);
      letter-spacing: .18em;
      text-transform: uppercase;
      font-family: var(--mono);
      margin-bottom: 52px;
    }

    .landing-input-wrap {
      position: relative;
      margin-bottom: 28px;
    }

    .landing-input {
      background: var(--bg3);
      border: 1px solid var(--bg4);
      border-radius: var(--radius);
      padding: 16px 52px 16px 20px;
      font-size: 16px;
      color: var(--text);
      font-family: var(--font);
      font-weight: 500;
      width: 300px;
      text-align: left;
      outline: none;
      transition: border-color .2s, background .2s, box-shadow .2s;
      letter-spacing: -.01em;
    }

    .landing-input:focus {
      border-color: var(--accent);
      background: var(--bg4);
      box-shadow: 0 0 0 4px var(--border);
    }

    .landing-input::placeholder {
      color: var(--text3);
    }

    .landing-input-icon {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text3);
      font-size: 16px;
      pointer-events: none;
      font-family: var(--mono);
    }

    .mode-btns {
      display: flex;
      gap: 12px;
    }

    .mode-btn {
      background: var(--bg3);
      border: 1px solid var(--bg4);
      border-radius: var(--radius);
      padding: 20px 32px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      font-family: var(--font);
      letter-spacing: -.01em;
      cursor: pointer;
      transition: border-color .2s, background .2s, transform .18s var(--ease-spring), box-shadow .2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      min-width: 130px;
      position: relative;
      overflow: hidden;
    }

    .mode-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, var(--border2), transparent 70%);
      opacity: 0;
      transition: opacity .3s;
    }

    .mode-btn:hover {
      border-color: var(--accent);
      background: var(--bg4);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
    }

    .mode-btn:hover::before {
      opacity: 1;
    }

    .mode-btn:active {
      transform: translateY(0) scale(.97);
    }

    .mode-btn svg {
      width: 26px;
      height: 26px;
      stroke: var(--accent);
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform .3s var(--ease-spring);
    }

    .mode-btn:hover svg {
      transform: scale(1.15);
    }

    .landing-err {
      color: var(--negative);
      font-size: 12px;
      font-family: var(--mono);
      letter-spacing: .04em;
      height: 20px;
      margin-top: 16px;
      text-align: center;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity .2s, transform .2s;
    }

    .landing-err.show {
      opacity: 1;
      transform: none;
    }

    /* ─── CALL SCREEN ─── */
    #call {
      background: var(--bg);
      z-index: 1;
    }

    .call-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 24px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .call-name {
      font-size: 13px;
      font-family: var(--mono);
      color: var(--text3);
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .call-status-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      background: var(--bg3);
      border: 1px solid var(--bg4);
      border-radius: 100px;
      padding: 6px 14px;
      font-size: 11px;
      font-family: var(--mono);
      color: var(--text2);
      letter-spacing: .06em;
      transition: all .3s var(--ease-out);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text3);
      transition: background .3s, box-shadow .3s;
      flex-shrink: 0;
    }

    .status-dot.active {
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent2);
    }

    .status-dot.thinking {
      background: var(--amber);
      box-shadow: 0 0 6px var(--amber);
      animation: pulse-dot 1s ease-in-out infinite;
    }

    .status-dot.speaking {
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      animation: pulse-dot .6s ease-in-out infinite;
    }

    @keyframes pulse-dot {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .4
      }
    }

    /* ─── FACE SYSTEM ─── */
    .face-container {
      position: relative;
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Orbit ring */
    .face-orbit {
      position: absolute;
      width: 260px;
      height: 260px;
      inset: 0;
      margin: auto;
      border-radius: 50%;
      border: 1px solid transparent;
      transition: border-color .6s var(--ease-out), box-shadow .6s var(--ease-out);
      pointer-events: none;
    }

    .face-orbit.listening {
      border-color: rgba(212, 175, 55, .2);
      box-shadow: 0 0 0 8px rgba(212, 175, 55, .04), 0 0 40px rgba(212, 175, 55, .08);
      animation: orbit-spin 6s linear infinite;
    }

    .face-orbit.speaking {
      border-color: rgba(212, 175, 55, .15);
      box-shadow: 0 0 0 4px rgba(212, 175, 55, .06), 0 0 30px rgba(212, 175, 55, .1);
      animation: orbit-pulse 1.2s ease-in-out infinite;
    }

    @keyframes orbit-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes orbit-pulse {

      0%,
      100% {
        opacity: .6
      }

      50% {
        opacity: 1
      }
    }

    /* Sound ripples (listening) */
    .ripple-ring {
      position: absolute;
      width: 200px;
      height: 200px;
      inset: 0;
      margin: auto;
      border-radius: 50%;
      border: 1px solid var(--accent);
      opacity: 0;
      pointer-events: none;
    }

    .ripple-ring.r1 {
      animation: ripple 2.4s ease-out infinite;
    }

    .ripple-ring.r2 {
      animation: ripple 2.4s ease-out .8s infinite;
    }

    .ripple-ring.r3 {
      animation: ripple 2.4s ease-out 1.6s infinite;
    }

    @keyframes ripple {
      0% {
        transform: scale(.85);
        opacity: .4;
      }

      100% {
        transform: scale(1.7);
        opacity: 0;
      }
    }

    .face-wrap {
      position: relative;
      width: 200px;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    /* Wave bars flanking face */
    .wave-side {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 5px;
      opacity: 0;
      transition: opacity .4s var(--ease-out);
    }

    .wave-side.left {
      left: -48px;
      align-items: flex-end;
    }

    .wave-side.right {
      right: -48px;
      align-items: flex-start;
    }

    .wave-side.active {
      opacity: 1;
    }

    .wave-bar {
      height: 3px;
      border-radius: 2px;
      background: var(--accent);
    }

    .wave-side.left .wave-bar {
      border-radius: 0 2px 2px 0;
    }

    .wave-side.right .wave-bar {
      border-radius: 2px 0 0 2px;
    }

    @keyframes wb1 {

      0%,
      100% {
        width: 6px
      }

      50% {
        width: 20px
      }
    }

    @keyframes wb2 {

      0%,
      100% {
        width: 10px
      }

      50% {
        width: 28px
      }
    }

    @keyframes wb3 {

      0%,
      100% {
        width: 14px
      }

      50% {
        width: 36px
      }
    }

    @keyframes wb4 {

      0%,
      100% {
        width: 8px
      }

      50% {
        width: 24px
      }
    }

    @keyframes wb5 {

      0%,
      100% {
        width: 5px
      }

      50% {
        width: 14px
      }
    }

    .w1 {
      animation: wb1 .9s ease-in-out infinite 0s;
    }

    .w2 {
      animation: wb2 .9s ease-in-out infinite .12s;
    }

    .w3 {
      animation: wb3 .9s ease-in-out infinite .24s;
    }

    .w4 {
      animation: wb4 .9s ease-in-out infinite .16s;
    }

    .w5 {
      animation: wb5 .9s ease-in-out infinite .06s;
    }

    /* Face itself */
    .face {
      width: 180px;
      height: 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      position: relative;
      will-change: transform;
    }

    .eyes-row {
      display: flex;
      gap: 20px;
      align-items: center;
      margin-bottom: 14px;
      transition: margin-bottom .3s var(--ease-out);
    }

    .eye {
      position: relative;
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: #f0f0ee;
      overflow: hidden;
      flex-shrink: 0;
      transition: width .25s var(--ease-spring), height .25s var(--ease-spring),
        border-radius .25s var(--ease-spring), box-shadow .4s;
    }

    .eye.speaking {
      box-shadow: 0 0 20px rgba(212, 175, 55, .25);
    }

    .iris {
      position: absolute;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #111;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      transition: transform .12s var(--ease-out);
      will-change: transform;
    }

    .iris::before {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      background: #fff;
      border-radius: 50%;
      top: 7px;
      left: 7px;
    }

    .iris::after {
      content: '';
      position: absolute;
      width: 7px;
      height: 7px;
      background: var(--accent);
      border-radius: 50%;
      bottom: 9px;
      right: 9px;
      opacity: .95;
      box-shadow: 0 0 4px var(--accent);
    }

    .lid {
      position: absolute;
      width: 100%;
      background: var(--bg);
      border-radius: 0 0 50% 50%;
      top: 0;
      left: 0;
      height: 0;
      transition: height .13s var(--ease-out);
      z-index: 10;
    }

    /* Smile */
    .smile-wrap {
      width: 72px;
      height: 32px;
      opacity: 0;
      transform: scaleY(0.3) scaleX(.8);
      transform-origin: top center;
      transition: opacity .4s var(--ease-spring), transform .4s var(--ease-spring);
    }

    .smile-wrap.visible {
      opacity: 1;
      transform: scaleY(1) scaleX(1);
    }

    /* Face animations */
    @keyframes breathe {

      0%,
      100% {
        transform: translateY(0) scale(1);
      }

      50% {
        transform: translateY(-5px) scale(1.015);
      }
    }

    @keyframes think-sway {

      0%,
      100% {
        transform: translateX(0);
      }

      33% {
        transform: translateX(-3px);
      }

      66% {
        transform: translateX(3px);
      }
    }

    @keyframes spk-bounce {
      from {
        transform: translate(-50%, calc(-50% + 0px));
      }

      to {
        transform: translate(-50%, calc(-50% - 7px));
      }
    }

    @keyframes eye-pop {
      0% {
        transform: scale(1);
      }

      35% {
        transform: scale(1.28);
      }

      65% {
        transform: scale(.93);
      }

      100% {
        transform: scale(1);
      }
    }

    /* ─── VOLUME VISUALIZER ─── */
    .vol-bars {
      display: flex;
      gap: 3px;
      align-items: flex-end;
      height: 28px;
      margin-bottom: 24px;
    }

    .vol-bar {
      width: 3px;
      background: var(--accent);
      border-radius: 2px;
      transition: height .07s, opacity .07s;
      opacity: .35;
    }

    /* ─── CALL TRANSCRIPT ─── */
    .call-transcript {
      width: 100%;
      max-width: 380px;
      padding: 0 28px;
      max-height: 140px;
      overflow-y: auto;
      -webkit-mask-image: linear-gradient(transparent, #000 28%, #000 100%);
      mask-image: linear-gradient(transparent, #000 28%, #000 100%);
      scrollbar-width: none;
    }

    .call-transcript::-webkit-scrollbar {
      display: none;
    }

    .ct-msg {
      font-size: 13px;
      line-height: 1.65;
      margin-bottom: 10px;
      opacity: 0;
      transform: translateY(6px);
      animation: ct-in .32s var(--ease-out) forwards;
    }

    .ct-msg.user {
      color: var(--text2);
    }

    .ct-msg.assistant {
      color: var(--text);
    }

    .ct-label {
      font-size: 10px;
      font-family: var(--mono);
      color: var(--text3);
      letter-spacing: .1em;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    @keyframes ct-in {
      to {
        opacity: 1;
        transform: none;
      }
    }

    /* ─── END CALL BUTTON ─── */
    .end-call-btn {
      position: absolute;
      bottom: 44px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(242, 92, 92, .15);
      border: 1px solid rgba(242, 92, 92, .3);
      border-radius: 50%;
      width: 60px;
      height: 60px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .2s, border-color .2s, transform .2s var(--ease-spring), box-shadow .2s;
    }

    .end-call-btn:hover {
      background: rgba(242, 92, 92, .25);
      border-color: rgba(242, 92, 92, .6);
      transform: translateX(-50%) scale(1.1);
      box-shadow: 0 6px 24px rgba(242, 92, 92, .25);
    }

    .end-call-btn:active {
      transform: translateX(-50%) scale(.95);
    }

    .end-call-btn svg {
      width: 22px;
      height: 22px;
      stroke: var(--negative);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
    }

    /* ─── APP LAYOUT ─── */
    .app-row {
      display: flex;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
    }

    .screens-col {
      flex: 2;
      position: relative;
      min-width: 0;
    }

    body[data-screen="landing"] .dash-panel {
      display: none !important;
    }

    /* ─── TEXT CHAT ─── */
    #chat {
      align-items: stretch;
      justify-content: flex-start;
      z-index: 1;
    }

    .chat-header {
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--bg3);
      flex-shrink: 0;
      backdrop-filter: blur(12px);
      background: rgba(8, 10, 7, .8);
      position: relative;
      z-index: 10;
    }

    .chat-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -.03em;
    }

    .chat-badge {
      font-size: 10px;
      font-family: var(--mono);
      color: var(--text3);
      border: 1px solid var(--bg4);
      border-radius: 6px;
      padding: 3px 8px;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .dash-toggle-btn {
      display: none;
      background: none;
      border: 1px solid var(--bg4);
      border-radius: var(--radius-sm);
      color: var(--text2);
      cursor: pointer;
      padding: 8px;
      transition: all .2s;
    }

    .dash-toggle-btn:hover {
      border-color: var(--text3);
      color: var(--text);
    }

    .dash-toggle-btn svg {
      width: 16px;
      height: 16px;
      display: block;
    }

    .chat-end-btn {
      background: none;
      border: 1px solid var(--bg4);
      border-radius: var(--radius-sm);
      padding: 8px 16px;
      font-size: 12px;
      font-family: var(--mono);
      color: var(--text2);
      cursor: pointer;
      letter-spacing: .04em;
      transition: all .2s;
    }

    .chat-end-btn:hover {
      border-color: var(--negative);
      color: var(--negative);
    }

    .chat-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scrollbar-width: thin;
      scrollbar-color: var(--bg4) transparent;
    }

    .chat-messages::-webkit-scrollbar {
      width: 4px;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: var(--bg4);
      border-radius: 2px;
    }

    .msg {
      max-width: 78%;
      padding: 16px 20px;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 600;
      font-family: var(--font);
      line-height: 1.6;
      opacity: 0;
      transform: translateY(8px);
      animation: msg-in .3s var(--ease-out) forwards;
      position: relative;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      letter-spacing: .02em;
    }

    .msg.user {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--accent), #e8cc6a);
      color: var(--bg);
      border-bottom-right-radius: 6px;
      font-weight: 800;
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.25);
    }

    .msg.assistant {
      align-self: flex-start;
      background: rgba(212, 175, 55, 0.05);
      color: var(--text);
      border-bottom-left-radius: 6px;
      border: 1px solid rgba(212, 175, 55, 0.2);
      box-shadow: inset 0 0 10px rgba(212, 175, 55, 0.02);
    }

    .msg.system {
      align-self: center;
      color: var(--text3);
      font-size: 11px;
      font-family: var(--mono);
      background: none;
      padding: 4px 8px;
    }

    .msg.streaming {
      opacity: 1;
      animation: none;
    }

    .msg.streaming::after {
      content: '▍';
      animation: cursor-blink 1s steps(1) infinite;
      color: var(--accent);
      font-size: 13px;
    }

    @keyframes msg-in {
      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes cursor-blink {
      50% {
        opacity: 0
      }
    }

    /* ─── CHAT INPUT ─── */
    .chat-input-wrap {
      padding: 16px 24px 20px;
      border-top: 1px solid var(--bg3);
      display: flex;
      gap: 10px;
      flex-shrink: 0;
      background: rgba(8, 10, 7, .6);
      backdrop-filter: blur(12px);
    }

    .chat-input {
      flex: 1;
      background: rgba(212, 175, 55, 0.03);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 24px;
      padding: 16px 24px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      font-family: var(--font);
      outline: none;
      transition: border-color .2s, box-shadow .2s, transform .2s;
      letter-spacing: .02em;
    }

    .chat-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
      transform: translateY(-2px);
    }

    .chat-input::placeholder {
      color: var(--text3);
    }

    .chat-send {
      background: var(--accent);
      border: none;
      border-radius: 24px;
      padding: 0 24px;
      cursor: pointer;
      transition: background .2s, transform .15s var(--ease-spring), box-shadow .2s;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 64px;
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.2);
    }

    .chat-send:hover {
      background: #e8cc6a;
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 6px 16px rgba(212, 175, 55, 0.3);
    }

    .chat-send:active {
      transform: scale(.92);
    }

    .chat-send:disabled {
      opacity: .3;
      cursor: not-allowed;
    }

    .chat-send svg {
      width: 19px;
      height: 19px;
      stroke: var(--bg);
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform .2s var(--ease-spring);
    }

    .chat-send:hover:not(:disabled) svg {
      transform: translateX(2px) translateY(-2px);
    }

    /* ─── DASHBOARD PANEL ─── */
    .dash-panel {
      flex: 1;
      max-width: 380px;
      border-left: 1px solid var(--bg3);
      padding: 32px 24px;
      overflow-y: auto;
      flex-shrink: 0;
      display: block;
      scrollbar-width: none;
      background: var(--bg2);
      color: var(--text);
      animation: dash-slide-in .3s var(--ease-out);
    }

    .dash-panel::-webkit-scrollbar {
      display: none;
    }

    .dash-panel.open {
      display: block;
    }

    @keyframes dash-slide-in {
      from {
        opacity: 0;
        transform: translateX(16px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .dash-section {
      background: rgba(212, 175, 55, 0.04);
      border: 1px solid rgba(212, 175, 55, 0.15);
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2), inset 0 0 20px rgba(212, 175, 55, 0.02);
      transition: transform .3s var(--ease-spring), box-shadow .3s, border-color .3s;
    }

    .dash-section:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 12px 30px rgba(212, 175, 55, 0.15), inset 0 0 30px rgba(212, 175, 55, 0.05);
      border-color: rgba(212, 175, 55, 0.4);
    }

    .dash-label {
      font-size: 11px;
      font-weight: 700;
      font-family: var(--font);
      color: var(--text2);
      letter-spacing: .15em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .dash-value {
      font-size: 36px;
      font-weight: 900;
      font-family: var(--font);
      color: var(--accent);
      letter-spacing: -.05em;
      line-height: 1;
      text-shadow: 0 0 24px rgba(212, 175, 55, 0.4);
    }

    .dash-sub {
      font-size: 13px;
      font-weight: 600;
      color: var(--text3);
      font-family: var(--font);
      margin-top: 6px;
    }

    /* Savings ring */
    .savings-ring {
      width: 76px;
      height: 76px;
      margin: 0 auto 10px;
    }

    .savings-ring svg {
      transform: rotate(-90deg);
    }

    .savings-ring circle {
      fill: none;
      stroke-width: 5;
      stroke-linecap: round;
    }

    .savings-ring .track {
      stroke: var(--bg3);
    }

    .savings-ring .fill {
      stroke: var(--accent);
      filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.6));
      transition: stroke-dashoffset .9s var(--ease-out);
    }

    .savings-label {
      text-align: center;
      font-size: 14px;
      font-weight: 800;
      font-family: var(--font);
      color: var(--accent);
      text-shadow: 0 0 12px rgba(212, 175, 55, 0.3);
    }

    /* Category bars */
    .dash-bar-wrap {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .dash-bar-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dash-bar-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text2);
      width: 60px;
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: var(--font);
    }

    .dash-bar {
      flex: 1;
      height: 8px;
      background: var(--bg3);
      border-radius: 4px;
      overflow: hidden;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.3);
    }

    .dash-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--border), var(--accent));
      border-radius: 4px;
      width: 0;
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
      transition: width .8s var(--ease-out);
    }

    .dash-bar-amt {
      font-size: 11px;
      font-weight: 700;
      font-family: var(--font);
      color: var(--accent);
      width: 48px;
      text-align: right;
    }

    /* Recent transactions */
    .tx-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .tx-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      padding: 12px 14px;
      margin: 4px 0;
      border-radius: 12px;
      background: rgba(212, 175, 55, 0.06);
      border: 1px solid rgba(212, 175, 55, 0.1);
      opacity: 0;
      transition: transform .2s, background .2s;
      animation: tx-in .25s var(--ease-out) forwards;
    }

    .tx-item:hover {
      background: rgba(212, 175, 55, 0.12);
      transform: scale(1.02);
    }

    .tx-item:last-child {
      border-bottom: none;
    }

    .tx-cat {
      font-weight: 700;
      color: var(--text);
      font-family: var(--font);
      letter-spacing: .02em;
    }

    .tx-date {
      color: var(--text3);
      font-family: var(--mono);
      font-size: 10px;
    }

    .tx-amt {
      font-family: var(--font);
      font-size: 14px;
      font-weight: 800;
      color: var(--accent);
      text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
    }

    @keyframes tx-in {
      to {
        opacity: 1;
      }
    }

    /* ─── TOAST ─── */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: var(--bg3);
      border: 1px solid var(--bg4);
      border-radius: var(--radius-sm);
      padding: 10px 20px;
      font-size: 12px;
      font-family: var(--mono);
      color: var(--text2);
      letter-spacing: .04em;
      opacity: 0;
      transition: opacity .25s, transform .25s var(--ease-spring);
      pointer-events: none;
      z-index: 10000;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast.error {
      border-color: rgba(242, 92, 92, .4);
      color: var(--negative);
    }

    /* ─── MOBILE ─── */
    @media (max-width: 700px) {
      .dash-toggle-btn {
        display: flex;
        align-items: center;
      }

      .dash-panel {
        position: fixed;
        top: 0;
        right: -300px;
        width: 280px;
        height: 100vh;
        z-index: 200;
        display: block !important;
        transition: right .35s var(--ease-out), box-shadow .35s;
        box-shadow: none;
      }

      .dash-panel.open {
        right: 0;
        box-shadow: -20px 0 60px rgba(0, 0, 0, .6);
      }

      .dash-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, .6);
        z-index: 199;
        opacity: 0;
        pointer-events: none;
        transition: opacity .35s;
        backdrop-filter: blur(4px);
      }

      .dash-overlay.open {
        opacity: 1;
        pointer-events: auto;
      }

      .msg {
        max-width: 88%;
      }

      .landing-input {
        width: 280px;
      }
    }

    /* ─── RIPPLE EFFECT ─── */
    .ripple-fx {
      position: absolute;
      border-radius: 50%;
      background: rgba(212, 175, 55, .3);
      pointer-events: none;
      animation: ripple-fx .6s ease-out forwards;
    }

    @keyframes ripple-fx {
      from {
        transform: scale(0);
        opacity: 1;
      }

      to {
        transform: scale(3);
        opacity: 0;
      }
    }
  </style>
</head>

  <!-- ===== TEXT CHAT ===== -->

  <div class="dash-overlay" id="dash-overlay" onclick="toggleDashboard()"></div>

        <svg viewBox="0 0 76 76">
          <circle class="track" cx="38" cy="38" r="32" />
          <circle class="fill" id="savings-fill" cx="38" cy="38" r="32" stroke-dasharray="201.1" stroke-dashoffset="201.1" />
        </svg>

      <div class="dash-label">income</div>

      <div class="dash-sub">this month</div>
    </div>
    <div class="dash-section">
      <div class="dash-label">spent</div>
      <div class="dash-value" id="dash-expense" style="color:var(--negative)">₹0</div>
      <div class="dash-sub">this month</div>
    </div>
    <div class="dash-section">
      <div class="dash-label">by category</div>
      <div class="dash-bar-wrap" id="dash-cats"></div>
    </div>

      <div class="dash-label">recent</div>
      <div class="tx-list" id="dash-tx"></div>
    </div>
  </div>
  </div> <!-- Close .app-row -->

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    // ═══════════════════════════════════════════════════
    //  STATE
    // ═══════════════════════════════════════════════════
    let ws = null, userId = '', sessionMode = null;
    let audioCtx = null, micStream = null, scriptNode = null;
    let isRecording = false, silenceTimer = null;
    let audioQueue = [], isPlayingAudio = false, currentAudio = null;
    let streamingEl = null, bargedIn = false;

    const SILENCE_THRESHOLD = 0.008;
    const BARGE_IN_THRESHOLD_MIN = 0.015;
    let dynamicBargeInThreshold = 0.022;
    let baselineSamples = [];
    const BASELINE_SAMPLE_COUNT = 5;
    const SILENCE_DURATION = 700;
    const VOL_BAR_COUNT = 14;

    // ═══════════════════════════════════════════════════
    //  INIT
    // ═══════════════════════════════════════════════════
    const usernameInput = document.getElementById('username-input');
    const saved = localStorage.getItem('artha_user');
    if (saved) usernameInput.value = saved;

    // Build volume bars
    const volBarsEl = document.getElementById('vol-bars');
    for (let i = 0; i < VOL_BAR_COUNT; i++) {
      const b = document.createElement('div');
      b.className = 'vol-bar';
      b.style.height = '3px';
      volBarsEl.appendChild(b);
    }

    // Landing: Enter key triggers text mode
    usernameInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') startSession('text');
    });

    // Activate ambient bg after short delay
    setTimeout(() => {
      document.getElementById('amb1').classList.add('active');
      document.getElementById('amb2').classList.add('active');
    }, 300);

    // ═══════════════════════════════════════════════════
    //  SCREEN NAVIGATION
    // ═══════════════════════════════════════════════════
    function showScreen(id) {
      document.body.dataset.screen = id;
      document.querySelectorAll('.screen.active').forEach(s => {
        s.classList.remove('active');
      });
      const target = document.getElementById(id);
      target.classList.add('active');
    }

    function toggleDashboard() {
      const panel = document.getElementById('dash-panel');
      const overlay = document.getElementById('dash-overlay');
      panel.classList.toggle('open');
      overlay.classList.toggle('open');
    }

    function toast(msg, type = '') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast' + (type ? ' ' + type : '');
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3200);
    }

    function showError(msg) {
      const el = document.getElementById('landing-err');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 3000);
    }

    // Ripple on button click
    function addRipple(e, el) {
      const r = document.createElement('div');
      const rect = el.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      r.className = 'ripple-fx';
      r.style.cssText = `width:${size / 2}px;height:${size / 2}px;left:${e.clientX - rect.left - size / 4}px;top:${e.clientY - rect.top - size / 4}px`;
      el.appendChild(r);
      setTimeout(() => r.remove(), 600);
    }

    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', e => addRipple(e, btn));
    });

    // ═══════════════════════════════════════════════════
    //  SESSION
    // ═══════════════════════════════════════════════════
    function startSession(mode) {
      userId = usernameInput.value.trim().replace(/[^a-zA-Z0-9_-]/g, '');
      if (!userId) {
        showError('enter a username first');
        usernameInput.focus();
        return;
      }
      localStorage.setItem('artha_user', userId);
      sessionMode = mode;

      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}/ws/${userId}`);

      ws.onopen = () => {
        ws.send(JSON.stringify({ type: 'session_start', mode }));
        if (mode === 'mic') {
          document.getElementById('call-user').textContent = userId;
          showScreen('call');
          startMic();
        } else {
          showScreen('chat');
          document.getElementById('dash-panel').classList.add('open');
        }
      };
      ws.onclose = () => { toast('Connection closed'); cleanup(); };
      ws.onerror = () => toast('Connection error', 'error');
      ws.onmessage = e => handleMsg(JSON.parse(e.data));
    }

    function endSession() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'end_session' }));
      }
      cleanup();
      showScreen('landing');
    }

    function cleanup() {
      stopMic();
      audioQueue = []; isPlayingAudio = false; currentAudio = null; streamingEl = null;
      if (ws) { try { ws.close(); } catch (e) { } ws = null; }
      document.getElementById('call-transcript').innerHTML = '';
      document.getElementById('chat-messages').innerHTML = '';
      setOrbState('idle');
    }

    // ═══════════════════════════════════════════════════
    //  FACE / ORB SYSTEM
    // ═══════════════════════════════════════════════════
    const face = document.getElementById('face');
    const eyeL = document.getElementById('eye-l');
    const eyeR = document.getElementById('eye-r');
    const irisL = document.getElementById('iris-l');
    const irisR = document.getElementById('iris-r');
    const lidL = document.getElementById('lid-l');
    const lidR = document.getElementById('lid-r');
    const smile = document.getElementById('smile');
    const waveL = document.getElementById('wave-l');
    const waveR = document.getElementById('wave-r');
    const orbit = document.getElementById('face-orbit');
    const eyesRow = document.getElementById('eyes-row');
    const rr1 = document.getElementById('rr1');
    const rr2 = document.getElementById('rr2');
    const rr3 = document.getElementById('rr3');
    const sdot = document.getElementById('status-dot');

    let faceState = 'idle';
    let blinkTimer = null;

    function resetFace() {
      face.style.animation = '';
      [eyeL, eyeR].forEach(e => {
        e.style.animation = '';
        e.style.width = e.style.height = '88px';
        e.style.borderRadius = '50%';
        e.classList.remove('speaking');
      });
      [irisL, irisR].forEach(i => { i.style.animation = ''; i.style.transform = 'translate(-50%,-50%)'; });
      lidL.style.height = lidR.style.height = '0';
      smile.classList.remove('visible');
      waveL.classList.remove('active');
      waveR.classList.remove('active');
      orbit.className = 'face-orbit';
      [rr1, rr2, rr3].forEach(r => r.style.display = 'none');
      eyesRow.style.marginBottom = '14px';
      clearTimeout(blinkTimer);
    }

    function blink(cb) {
      lidL.style.height = lidR.style.height = '52%';
      setTimeout(() => {
        lidL.style.height = lidR.style.height = '0';
        if (cb) cb();
      }, 140);
    }

    function scheduleBlink() {
      blinkTimer = setTimeout(() => {
        if (['idle', 'listening', 'speaking'].includes(faceState)) {
          blink(() => scheduleBlink());
        }
      }, 2400 + Math.random() * 3000);
    }

    function movePupils(dx, dy) {
      const t = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
      irisL.style.transform = t;
      irisR.style.transform = t;
    }

    window.updateRMS = function (rms) {
      if (faceState !== 'listening') return;
      const v = Math.min(rms * 14, 1);
      movePupils(0, v * 9 - 4);
    };

    function setCallStatus(text, dotClass) {
      const el = document.getElementById('call-status');
      if (el) el.textContent = text;
      if (sdot) sdot.className = 'status-dot' + (dotClass ? ' ' + dotClass : '');
    }

    function setOrbState(s) {
      faceState = s;
      resetFace();

      if (s === 'idle') {
        face.style.animation = 'breathe 4.5s ease-in-out infinite';
        setCallStatus('ready', '');
        scheduleBlink();
      }

      if (s === 'listening') {
        eyeL.style.width = eyeR.style.width = '98px';
        eyeL.style.height = eyeR.style.height = '98px';
        waveL.classList.add('active');
        waveR.classList.add('active');
        orbit.classList.add('listening');
        [rr1, rr2, rr3].forEach(r => r.style.display = '');
        setCallStatus('listening', 'active');
        scheduleBlink();
      }

      if (s === 'thinking') {
        movePupils(-11, -13);
        lidR.style.height = '38%';
        face.style.animation = 'think-sway 3s ease-in-out infinite';
        setCallStatus('thinking', 'thinking');
      }

      if (s === 'speaking') {
        irisL.style.animation = 'spk-bounce .42s ease-in-out infinite alternate';
        irisR.style.animation = 'spk-bounce .42s ease-in-out infinite alternate';
        eyeL.style.height = eyeR.style.height = '82px';
        eyeL.classList.add('speaking');
        eyeR.classList.add('speaking');
        eyesRow.style.marginBottom = '10px';
        smile.classList.add('visible');
        orbit.classList.add('speaking');
        setCallStatus('speaking', 'speaking');
        scheduleBlink();
      }

      if (s === 'barge-in') {
        [eyeL, eyeR].forEach(e => { e.style.animation = 'eye-pop .48s ease forwards'; });
        waveL.classList.add('active');
        waveR.classList.add('active');
        setCallStatus('listening', 'active');
        setTimeout(() => { if (faceState === 'barge-in') setOrbState('listening'); }, 500);
      }
    }

    // Mouse-driven pupil sway on call screen
    document.addEventListener('mousemove', e => {
      if (faceState !== 'idle' && faceState !== 'thinking') return;
      const dx = (e.clientX / window.innerWidth - .5) * 10;
      const dy = (e.clientY / window.innerHeight - .5) * 8;
      movePupils(dx, dy);
    });

    // ═══════════════════════════════════════════════════
    //  MIC + VAD
    // ═══════════════════════════════════════════════════
    async function startMic() {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, sampleRate: 16000 }
        });
        const source = audioCtx.createMediaStreamSource(micStream);
        scriptNode = audioCtx.createScriptProcessor(4096, 1, 1);

        let speaking = false, chunks = [];

        scriptNode.onaudioprocess = e => {
          const data = e.inputBuffer.getChannelData(0);
          let sum = 0;
          for (let i = 0; i < data.length; i++) sum += data[i] * data[i];
          const rms = Math.sqrt(sum / data.length);

          updateVolBars(rms);
          if (typeof window.updateRMS === 'function') window.updateRMS(rms);

          if (isPlayingAudio) {
            if (baselineSamples.length < BASELINE_SAMPLE_COUNT) {
              baselineSamples.push(rms);
              if (baselineSamples.length === BASELINE_SAMPLE_COUNT) {
                const mean = baselineSamples.reduce((a, b) => a + b, 0) / BASELINE_SAMPLE_COUNT;
                dynamicBargeInThreshold = Math.max(mean * 2.5, BARGE_IN_THRESHOLD_MIN);
              }
            }
          }

          const threshold = isPlayingAudio ? dynamicBargeInThreshold : SILENCE_THRESHOLD;

          if (rms > threshold) {
            if (isPlayingAudio) bargeIn();
            if (!speaking) {
              speaking = true;
              bargedIn = false;
              ws.send(JSON.stringify({ type: 'stream_audio_start', sampleRate: audioCtx.sampleRate }));
              setOrbState('listening');
            }
            clearTimeout(silenceTimer);
            silenceTimer = null;

            const int16 = new Int16Array(data.length);
            for (let i = 0; i < data.length; i++) {
              const s = Math.max(-1, Math.min(1, data[i]));
              int16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
            }
            ws.send(JSON.stringify({ type: 'stream_audio_chunk', data: arrayBufferToBase64(int16.buffer) }));

          } else if (speaking) {
            if (!silenceTimer) {
              silenceTimer = setTimeout(() => {
                speaking = false;
                if (!bargedIn) {
                  ws.send(JSON.stringify({ type: 'stream_audio_end' }));
                  setOrbState('thinking');
                }
                silenceTimer = null;
              }, SILENCE_DURATION);
            }
          }
        };

        source.connect(scriptNode);
        scriptNode.connect(audioCtx.destination);
        isRecording = true;
        setOrbState('idle');
      } catch (err) {
        toast('Mic access denied', 'error');
      }
    }

    function bargeIn() {
      if (!isPlayingAudio) return;
      if (currentAudio) { try { currentAudio.pause(); } catch (e) { } currentAudio = null; }
      audioQueue = [];
      isPlayingAudio = false;
      bargedIn = true;
      baselineSamples = [];
      dynamicBargeInThreshold = 0.022;
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'barge_in' }));
      }
      setOrbState('barge-in');
    }

    function stopMic() {
      isRecording = false;
      clearTimeout(silenceTimer);
      if (scriptNode) { try { scriptNode.disconnect(); } catch (e) { } scriptNode = null; }
      if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
      if (audioCtx) { try { audioCtx.close(); } catch (e) { } audioCtx = null; }
    }

    function updateVolBars(rms) {
      const bars = volBarsEl.children;
      const level = Math.min(rms * 14, 1);
      const n = bars.length;
      for (let i = 0; i < n; i++) {
        const dist = Math.abs(i - (n - 1) / 2) / ((n - 1) / 2);
        const envelope = 1 - dist * 0.65;
        const h = Math.max(3, level * envelope * 26);
        bars[i].style.height = h + 'px';
        bars[i].style.opacity = 0.25 + level * 0.75;
      }
    }

    // ═══════════════════════════════════════════════════
    //  TEXT CHAT
    // ═══════════════════════════════════════════════════
    const chatInput = document.getElementById('chat-input');
    chatInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); }
    });

    function sendText() {
      const val = chatInput.value.trim();
      if (!val || !ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ type: 'text', content: val }));
      chatInput.value = '';
    }

    function addChatMsg(role, text) {
      const container = document.getElementById('chat-messages');
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      div.textContent = text;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
      return div;
    }

    function addCallMsg(role, text) {
      const container = document.getElementById('call-transcript');
      const div = document.createElement('div');
      div.className = 'ct-msg ' + role;
      div.innerHTML = `<div class="ct-label">${role}</div>${text}`;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    // ═══════════════════════════════════════════════════
    //  AUDIO QUEUE
    // ═══════════════════════════════════════════════════
    function queueAudio(b64, index) {
      audioQueue.push({ b64, index });
      audioQueue.sort((a, b) => a.index - b.index);
      playNext();
    }

    function playNext() {
      if (isPlayingAudio || audioQueue.length === 0) {
        if (!isPlayingAudio && audioQueue.length === 0 && sessionMode === 'mic') {
          baselineSamples = [];
          setOrbState('idle');
        }
        return;
      }
      isPlayingAudio = true;
      const item = audioQueue.shift();

      const raw = atob(item.b64);
      const arr = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);

      const blob = new Blob([arr], { type: 'audio/wav' });
      const url = URL.createObjectURL(blob);
      const audio = new Audio(url);
      currentAudio = audio;

      audio.onended = () => { URL.revokeObjectURL(url); currentAudio = null; isPlayingAudio = false; playNext(); };
      audio.onerror = () => { currentAudio = null; isPlayingAudio = false; playNext(); };
      audio.play().catch(() => { currentAudio = null; isPlayingAudio = false; playNext(); });

      if (sessionMode === 'mic') setOrbState('speaking');
    }

    // ═══════════════════════════════════════════════════
    //  WS MESSAGE HANDLER
    // ═══════════════════════════════════════════════════
    function handleMsg(msg) {
      switch (msg.type) {

        case 'audio':
          if (sessionMode === 'mic') addCallMsg('assistant', msg.text);
          else addChatMsg('assistant', msg.text);
          queueAudio(msg.data, 0);
          break;

        case 'text_only':
          if (sessionMode === 'mic') {
            addCallMsg('assistant', msg.text);
            setOrbState('idle');
          } else {
            addChatMsg('assistant', msg.text);
          }
          break;

        case 'transcript':
          if (sessionMode === 'mic') addCallMsg('user', msg.text);
          else addChatMsg('user', msg.text);
          break;

        case 'status':
          if (sessionMode === 'mic' && msg.state === 'thinking') setOrbState('thinking');
          break;

        case 'stream_text':
          if (sessionMode === 'text') {
            if (!streamingEl) {
              streamingEl = addChatMsg('assistant', '');
              streamingEl.classList.add('streaming');
            }
            streamingEl.textContent += msg.text;
            document.getElementById('chat-messages').scrollTop = 999999;
          } else {
            if (!streamingEl) {
              streamingEl = document.createElement('div');
              streamingEl.className = 'ct-msg assistant';
              streamingEl.innerHTML = '<div class="ct-label">assistant</div>';
              document.getElementById('call-transcript').appendChild(streamingEl);
            }
            streamingEl.textContent += msg.text;
          }
          break;

        case 'stream_audio':
          queueAudio(msg.data, msg.index);
          break;

        case 'stream_end':
          if (streamingEl) { streamingEl.classList.remove('streaming'); streamingEl = null; }
          if (sessionMode === 'mic' && audioQueue.length === 0 && !isPlayingAudio) setOrbState('idle');
          break;

        case 'dashboard_update':
          updateDash(msg.data);
          break;

        case 'session_ended':
          toast('Session saved ✓');
          cleanup();
          showScreen('landing');
          break;

        case 'error':
          toast(msg.text, 'error');
          if (sessionMode === 'mic') setOrbState('idle');
          break;
      }
    }

    // ═══════════════════════════════════════════════════
    //  DASHBOARD
    // ═══════════════════════════════════════════════════
    function updateDash(d) {
      document.getElementById('dash-income').textContent = '₹' + fmt(d.total_income);
      document.getElementById('dash-expense').textContent = '₹' + fmt(d.total_expense);

      const rate = d.savings_rate || 0;
      document.getElementById('savings-label').textContent = rate + '%';
      const circ = 201.1;
      document.getElementById('savings-fill').style.strokeDashoffset =
        circ - (circ * Math.min(rate, 100) / 100);

      // Category bars (animate on render)
      const cats = d.by_category || {};
      const maxCat = Math.max(...Object.values(cats), 1);
      const catsEl = document.getElementById('dash-cats');
      catsEl.innerHTML = '';
      Object.entries(cats).forEach(([cat, amt]) => {
        const pct = ((amt / maxCat) * 100).toFixed(0);
        const row = document.createElement('div');
        row.className = 'dash-bar-item';
        row.innerHTML = `
      <div class="dash-bar-name">${cat}</div>
      <div class="dash-bar"><div class="dash-bar-fill" style="width:0%" data-pct="${pct}%"></div></div>
      <div class="dash-bar-amt">₹${fmtShort(amt)}</div>
    `;
        catsEl.appendChild(row);
      });
      // Trigger bar animations after paint
      requestAnimationFrame(() => {
        catsEl.querySelectorAll('.dash-bar-fill').forEach(el => {
          el.style.width = el.dataset.pct;
        });
      });

      // Recent transactions
      const txEl = document.getElementById('dash-tx');
      txEl.innerHTML = '';
      const recent = (d.recent_tx || []).slice(-6).reverse();
      recent.forEach((tx, i) => {
        const item = document.createElement('div');
        item.className = 'tx-item';
        item.style.animationDelay = (i * 40) + 'ms';
        item.innerHTML = `
      <span class="tx-cat">${tx.category}</span>
      <span class="tx-date">${tx.date ? tx.date.slice(5) : ''}</span>
      <span class="tx-amt">₹${Math.abs(tx.amount)}</span>
    `;
        txEl.appendChild(item);
      });

      document.getElementById('dash-panel').classList.add('open');
    }

    function fmt(n) {
      if (!n) return '0';
      return Number(n).toLocaleString('en-IN', { maximumFractionDigits: 0 });
    }
    function fmtShort(n) {
      if (n >= 100000) return (n / 100000).toFixed(1) + 'L';
      if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
      return Math.round(n);
    }

    function arrayBufferToBase64(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = '';
      for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      return btoa(binary);
    }

    // Fetch dashboard for returning user on load
    window.addEventListener('load', () => {
      const u = localStorage.getItem('artha_user');
      if (u) {
        fetch(`/api/dashboard?user_id=${u}`)
          .then(r => r.json())
          .then(d => { if (!d.error) updateDash(d); })
          .catch(() => { });
      }
    });
  </script>
