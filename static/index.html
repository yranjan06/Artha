<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Artha Voice Finance Agent</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=JetBrains+Mono:wght@400;500&display=swap');

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --bg: #0a0c08;
      --bg2: #12150e;
      --bg3: #1a1e15;
      --bg4: #222820;
      --lime: #b5e853;
      --lime2: #8fc93a;
      --lime3: #6ba31e;
      --lime-dim: rgba(181, 232, 83, .12);
      --text: #e8ead0;
      --text2: #a3a68a;
      --text3: #6b6e56;
      --red: #e85353;
      --amber: #efa827;
      --radius: 14px;
      --radius-sm: 8px;
      --font: 'DM Sans', system-ui, sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }

    html,
    body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      overflow: hidden
    }

    /* ===== SCREENS ===== */
    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity .5s, transform .5s;
      opacity: 0;
      pointer-events: none;
      transform: scale(.96)
    }

    .screen.active {
      opacity: 1;
      pointer-events: all;
      transform: scale(1)
    }

    /* ===== LANDING ===== */
    #landing {
      gap: 32px
    }

    .landing-logo {
      font-size: 48px;
      font-weight: 600;
      letter-spacing: -.03em;
      color: var(--lime)
    }

    .landing-logo span {
      color: var(--text3);
      font-weight: 300;
      font-size: 16px;
      display: block;
      letter-spacing: .08em;
      margin-top: 4px
    }

    .landing-input {
      background: var(--bg3);
      border: 1px solid var(--bg4);
      border-radius: var(--radius);
      padding: 14px 20px;
      font-size: 16px;
      color: var(--text);
      font-family: var(--font);
      width: 280px;
      text-align: center;
      outline: none;
      transition: border-color .2s
    }

    .landing-input:focus {
      border-color: var(--lime3)
    }

    .landing-input::placeholder {
      color: var(--text3)
    }

    .mode-btns {
      display: flex;
      gap: 16px;
      margin-top: 8px
    }

    .mode-btn {
      background: var(--bg3);
      border: 1px solid var(--bg4);
      border-radius: var(--radius);
      padding: 16px 28px;
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      font-family: var(--font);
      cursor: pointer;
      transition: all .2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      min-width: 130px
    }

    .mode-btn:hover {
      border-color: var(--lime3);
      background: var(--lime-dim)
    }

    .mode-btn:active {
      transform: scale(.96)
    }

    .mode-btn svg {
      width: 28px;
      height: 28px;
      stroke: var(--lime);
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .mode-btn.disabled {
      opacity: .3;
      pointer-events: none
    }

    .landing-err {
      color: var(--red);
      font-size: 13px;
      height: 18px
    }

    /* ===== CALL SCREEN (MIC) ===== */
    #call {
      background: var(--bg)
    }

    .call-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10
    }

    .call-name {
      font-size: 14px;
      color: var(--text2);
      letter-spacing: .04em
    }

    .call-status {
      font-size: 12px;
      font-family: var(--mono);
      color: var(--lime);
      letter-spacing: .06em;
      opacity: .7
    }

    /* Face wrap */
    .face-wrap {
      position: relative;
      width: 320px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 40px;
    }

    /* sound waves — left and right of face */
    .wave-side {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 5px;
      opacity: 0;
      transition: opacity .3s ease;
    }

    .wave-side.left { left: 0; align-items: flex-end; }
    .wave-side.right { right: 0; align-items: flex-start; }

    .wave-bar {
      height: 4px;
      border-radius: 2px;
      background: #b5e853;
      transform-origin: center;
    }
    .wave-side.left .wave-bar { border-radius: 0 2px 2px 0; }
    .wave-side.right .wave-bar { border-radius: 2px 0 0 2px; }

    /* animated wave bars */
    @keyframes wave1 { 0%, 100% { width: 8px } 50% { width: 22px } }
    @keyframes wave2 { 0%, 100% { width: 14px } 50% { width: 32px } }
    @keyframes wave3 { 0%, 100% { width: 18px } 50% { width: 40px } }
    @keyframes wave4 { 0%, 100% { width: 10px } 50% { width: 28px } }
    @keyframes wave5 { 0%, 100% { width: 6px } 50% { width: 16px } }

    .wave-side.active { opacity: 1; }
    .w1 { animation: wave1 .8s ease-in-out infinite; animation-delay: 0s; }
    .w2 { animation: wave2 .8s ease-in-out infinite; animation-delay: .1s; }
    .w3 { animation: wave3 .8s ease-in-out infinite; animation-delay: .2s; }
    .w4 { animation: wave4 .8s ease-in-out infinite; animation-delay: .15s; }
    .w5 { animation: wave5 .8s ease-in-out infinite; animation-delay: .05s; }

    /* face */
    .face {
      width: 240px;
      height: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      position: relative;
    }

    .eyes-row {
      display: flex;
      gap: 24px;
      align-items: center;
      margin-bottom: 14px;
    }

    .eye {
      position: relative;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: #efefef;
      overflow: hidden;
      flex-shrink: 0;
      transition: width .2s ease, height .2s ease;
    }

    .iris {
      position: absolute;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: #111;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      transition: transform .1s ease-out;
      will-change: transform;
    }
    .iris::before {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      background: #fff;
      border-radius: 50%;
      top: 8px;
      left: 8px;
    }
    .iris::after {
      content: '';
      position: absolute;
      width: 6px;
      height: 6px;
      background: #b5e853;
      border-radius: 50%;
      bottom: 10px;
      right: 10px;
      opacity: .9;
    }

    .lid {
      position: absolute;
      width: 100%;
      background: #0a0c08;
      border-radius: 0 0 50% 50%;
      top: 0;
      left: 0;
      height: 0;
      transition: height .12s ease;
      z-index: 10;
    }

    /* smile */
    .smile-wrap {
      width: 80px;
      height: 36px;
      opacity: 0;
      transform: scaleY(0.4);
      transform-origin: top center;
      transition: opacity .35s ease, transform .35s ease;
    }
    .smile-wrap.visible {
      opacity: 1;
      transform: scaleY(1);
    }

    /* KEYFRAMES */
    @keyframes breathe {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-4px) scale(1.02); }
    }
    @keyframes spk-bounce {
      from { transform: translate(-50%, calc(-50% + 0px)); }
      to { transform: translate(-50%, calc(-50% - 6px)); }
    }
    @keyframes pop {
      0% { transform: scale(1); }
      40% { transform: scale(1.3); }
      70% { transform: scale(0.92); }
      100% { transform: scale(1); }
    }

    /* Volume bars */
    .vol-bars {
      display: flex;
      gap: 3px;
      align-items: flex-end;
      height: 24px;
      margin-bottom: 20px
    }

    .vol-bar {
      width: 4px;
      background: var(--lime);
      border-radius: 2px;
      transition: height .08s;
      opacity: .5
    }

    /* Call transcript */
    .call-transcript {
      width: 100%;
      max-width: 400px;
      padding: 0 24px;
      max-height: 160px;
      overflow-y: auto;
      mask-image: linear-gradient(transparent, #000 20%, #000 100%);
      -webkit-mask-image: linear-gradient(transparent, #000 20%, #000 100%);
    }

    .call-transcript::-webkit-scrollbar {
      display: none
    }

    .ct-msg {
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 8px;
      opacity: 0;
      animation: ct-in .3s forwards
    }

    .ct-msg.user {
      color: var(--text2)
    }

    .ct-msg.assistant {
      color: var(--text)
    }

    .ct-msg .ct-label {
      font-size: 11px;
      font-family: var(--mono);
      color: var(--text3);
      letter-spacing: .06em;
      margin-bottom: 2px
    }

    @keyframes ct-in {
      to {
        opacity: 1
      }
    }

    .end-call-btn {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--red);
      border: none;
      border-radius: 50%;
      width: 64px;
      height: 64px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .2s, box-shadow .2s;
      box-shadow: 0 4px 20px rgba(232, 83, 83, .3)
    }

    .end-call-btn:hover {
      transform: translateX(-50%) scale(1.08)
    }

    .end-call-btn:active {
      transform: translateX(-50%) scale(.95)
    }

    .end-call-btn svg {
      width: 24px;
      height: 24px;
      stroke: #fff;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round
    }

    /* ===== TEXT CHAT ===== */
    #chat {
      display: flex;
      flex-direction: column
    }

    .chat-header {
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--bg3);
      flex-shrink: 0
    }

    .chat-title {
      font-size: 18px;
      font-weight: 500;
      color: var(--lime);
      letter-spacing: -.01em
    }

    .dash-toggle-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text2);
      cursor: pointer;
      padding: 4px;
      margin-left: -4px;
    }
    .dash-toggle-btn svg {
      width: 20px;
      height: 20px;
    }

    .chat-end-btn {
      background: none;
      border: 1px solid var(--bg4);
      border-radius: var(--radius-sm);
      padding: 8px 16px;
      font-size: 12px;
      color: var(--text2);
      font-family: var(--font);
      cursor: pointer;
      transition: all .2s;
      letter-spacing: .04em
    }

    .chat-end-btn:hover {
      border-color: var(--red);
      color: var(--red)
    }

    .chat-body {
      display: flex;
      flex: 1;
      overflow: hidden
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px
    }

    .chat-messages::-webkit-scrollbar {
      width: 4px
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: var(--bg4);
      border-radius: 2px
    }

    .msg {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.6;
      opacity: 0;
      animation: msg-in .3s forwards
    }

    .msg.user {
      align-self: flex-end;
      background: var(--lime3);
      color: #fff;
      border-bottom-right-radius: 4px
    }

    .msg.assistant {
      align-self: flex-start;
      background: var(--bg3);
      color: var(--text);
      border-bottom-left-radius: 4px
    }

    .msg.system {
      align-self: center;
      color: var(--text3);
      font-size: 12px;
      font-style: italic;
      background: none;
      padding: 4px
    }

    .msg.streaming {
      opacity: 1
    }

    .msg.streaming::after {
      content: '▍';
      animation: blink 1s steps(1) infinite;
      color: var(--lime)
    }

    @keyframes msg-in {
      to {
        opacity: 1
      }
    }

    @keyframes blink {
      50% {
        opacity: 0
      }
    }

    .chat-input-wrap {
      padding: 16px 24px;
      border-top: 1px solid var(--bg3);
      display: flex;
      gap: 12px;
      flex-shrink: 0
    }

    .chat-input {
      flex: 1;
      background: var(--bg3);
      border: 1px solid var(--bg4);
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: 14px;
      color: var(--text);
      font-family: var(--font);
      outline: none;
      transition: border-color .2s
    }

    .chat-input:focus {
      border-color: var(--lime3)
    }

    .chat-input::placeholder {
      color: var(--text3)
    }

    .chat-send {
      background: var(--lime3);
      border: none;
      border-radius: var(--radius);
      padding: 0 20px;
      cursor: pointer;
      transition: all .2s;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .chat-send:hover {
      background: var(--lime2)
    }

    .chat-send:active {
      transform: scale(.95)
    }

    .chat-send svg {
      width: 18px;
      height: 18px;
      stroke: #fff;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .chat-send:disabled {
      opacity: .3;
      cursor: not-allowed
    }

    /* Dashboard sidebar */
    .dash-panel {
      width: 280px;
      border-left: 1px solid var(--bg3);
      padding: 20px;
      overflow-y: auto;
      flex-shrink: 0;
      display: none
    }

    .dash-panel.open {
      display: block
    }

    .dash-section {
      margin-bottom: 24px
    }

    .dash-label {
      font-size: 11px;
      font-family: var(--mono);
      color: var(--text3);
      letter-spacing: .08em;
      margin-bottom: 8px;
      text-transform: uppercase
    }

    .dash-value {
      font-size: 28px;
      font-weight: 600;
      color: var(--lime);
      letter-spacing: -.02em
    }

    .dash-sub {
      font-size: 13px;
      color: var(--text2);
      margin-top: 2px
    }

    .dash-bar-wrap {
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .dash-bar-item {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .dash-bar-name {
      font-size: 12px;
      color: var(--text2);
      width: 60px;
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .dash-bar {
      flex: 1;
      height: 6px;
      background: var(--bg4);
      border-radius: 3px;
      overflow: hidden
    }

    .dash-bar-fill {
      height: 100%;
      background: var(--lime);
      border-radius: 3px;
      transition: width .5s
    }

    .dash-bar-amt {
      font-size: 11px;
      font-family: var(--mono);
      color: var(--text3);
      width: 50px
    }

    /* Savings ring */
    .savings-ring {
      width: 80px;
      height: 80px;
      margin: 0 auto 8px
    }

    .savings-ring svg {
      transform: rotate(-90deg)
    }

    .savings-ring circle {
      fill: none;
      stroke-width: 6;
      stroke-linecap: round
    }

    .savings-ring .track {
      stroke: var(--bg4)
    }

    .savings-ring .fill {
      stroke: var(--lime);
      transition: stroke-dashoffset .8s
    }

    /* Recent tx */
    .tx-list {
      display: flex;
      flex-direction: column;
      gap: 4px
    }

    .tx-item {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      padding: 4px 0;
      border-bottom: 1px solid var(--bg3)
    }

    .tx-cat {
      color: var(--text2)
    }

    .tx-amt {
      font-family: var(--mono);
      color: var(--red)
    }

    /* Responsive */
    @media(max-width:700px) {
      .dash-toggle-btn {
        display: block;
      }

      .dash-panel {
        position: fixed;
        top: 0;
        right: -320px;
        width: 280px;
        height: 100vh;
        background: var(--bg2);
        z-index: 100;
        transition: right 0.3s ease;
        box-shadow: -5px 0 25px rgba(0,0,0,0.5);
        display: block !important;
      }

      .dash-panel.open {
        right: 0;
      }

      .dash-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.5);
        z-index: 99;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }

      .dash-overlay.open {
        opacity: 1;
        pointer-events: auto;
      }

      .msg {
        max-width: 90%
      }
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--bg3);
      border: 1px solid var(--bg4);
      border-radius: var(--radius-sm);
      padding: 10px 20px;
      font-size: 13px;
      color: var(--text2);
      opacity: 0;
      transition: all .3s;
      pointer-events: none;
      z-index: 100
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0)
    }
  </style>
</head>

<body>

  <!-- ===== LANDING ===== -->
  <div id="landing" class="screen active">
    <div class="landing-logo">Artha<span>voice finance agent</span></div>
    <input id="username-input" class="landing-input" placeholder="pick a username" maxlength="24" autocomplete="off"
      spellcheck="false">
    <div class="mode-btns">
      <button class="mode-btn" id="btn-mic" onclick="startSession('mic')">
        <svg viewBox="0 0 24 24">
          <path d="M12 1a4 4 0 0 0-4 4v6a4 4 0 0 0 8 0V5a4 4 0 0 0-4-4z" />
          <path d="M19 10v1a7 7 0 0 1-14 0v-1" />
          <line x1="12" y1="19" x2="12" y2="23" />
          <line x1="8" y1="23" x2="16" y2="23" />
        </svg>
        Call
      </button>
      <button class="mode-btn" id="btn-text" onclick="startSession('text')">
        <svg viewBox="0 0 24 24">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
        </svg>
        Text
      </button>
    </div>
    <div class="landing-err" id="landing-err"></div>
  </div>

  <!-- ===== CALL SCREEN ===== -->
  <div id="call" class="screen">
    <div class="call-header">
      <div class="call-name" id="call-user"></div>
      <div class="call-status" id="call-status">connecting...</div>
    </div>

    <div class="face-wrap">
      <div class="wave-side left" id="wave-l">
        <div class="wave-bar w5"></div><div class="wave-bar w3"></div><div class="wave-bar w1"></div>
        <div class="wave-bar w2"></div><div class="wave-bar w4"></div><div class="wave-bar w5"></div>
      </div>
      <div class="face" id="face">
        <div class="eyes-row" id="eyes-row">
          <div class="eye" id="eye-l"><div class="iris" id="iris-l"></div><div class="lid" id="lid-l"></div></div>
          <div class="eye" id="eye-r"><div class="iris" id="iris-r"></div><div class="lid" id="lid-r"></div></div>
        </div>
        <div class="smile-wrap" id="smile">
          <svg viewBox="0 0 80 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 8 Q40 34 72 8" stroke="#efefef" stroke-width="5" stroke-linecap="round" fill="none" />
          </svg>
        </div>
      </div>
      <div class="wave-side right" id="wave-r">
        <div class="wave-bar w5"></div><div class="wave-bar w3"></div><div class="wave-bar w1"></div>
        <div class="wave-bar w2"></div><div class="wave-bar w4"></div><div class="wave-bar w5"></div>
      </div>
    </div>

    <div class="vol-bars" id="vol-bars"></div>

    <div class="call-transcript" id="call-transcript"></div>

    <button class="end-call-btn" onclick="endSession()">
      <svg viewBox="0 0 24 24">
        <path
          d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.93.36 1.84.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 2.59 3.4z" />
      </svg>
    </button>
  </div>

  <!-- ===== TEXT CHAT ===== -->
  <div id="chat" class="screen">
    <div class="chat-header">
      <div style="display: flex; align-items: center; gap: 12px;">
        <button class="dash-toggle-btn" onclick="toggleDashboard()">
          <svg viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <div class="chat-title">artha</div>
      </div>
      <button class="chat-end-btn" onclick="endSession()">end session</button>
    </div>
    <div class="chat-body">
      <div class="chat-messages" id="chat-messages"></div>
      <div class="dash-overlay" id="dash-overlay" onclick="toggleDashboard()"></div>
      <div class="dash-panel" id="dash-panel">
        <div class="dash-section">
          <div class="dash-label">savings rate</div>
          <div class="savings-ring" id="savings-ring">
            <svg viewBox="0 0 80 80">
              <circle class="track" cx="40" cy="40" r="34" />
              <circle class="fill" id="savings-fill" cx="40" cy="40" r="34" stroke-dasharray="213.6"
                stroke-dashoffset="213.6" />
            </svg>
          </div>
          <div class="dash-sub" style="text-align:center" id="savings-label">0%</div>
        </div>
        <div class="dash-section">
          <div class="dash-label">income</div>
          <div class="dash-value" id="dash-income">₹0</div>
        </div>
        <div class="dash-section">
          <div class="dash-label">spent</div>
          <div class="dash-value" id="dash-expense" style="color:var(--red)">₹0</div>
        </div>
        <div class="dash-section">
          <div class="dash-label">by category</div>
          <div class="dash-bar-wrap" id="dash-cats"></div>
        </div>
        <div class="dash-section">
          <div class="dash-label">recent</div>
          <div class="tx-list" id="dash-tx"></div>
        </div>
      </div>
    </div>
    <div class="chat-input-wrap">
      <input class="chat-input" id="chat-input" placeholder="Type a message..." autocomplete="off">
      <button class="chat-send" id="chat-send" onclick="sendText()">
        <svg viewBox="0 0 24 24">
          <line x1="22" y1="2" x2="11" y2="13" />
          <polygon points="22 2 15 22 11 13 2 9 22 2" />
        </svg>
      </button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ===== STATE =====
    let ws = null;
    let userId = '';
    let sessionMode = null;
    let audioCtx = null;
    let micStream = null;
    let scriptNode = null;
    let isRecording = false;
    let silenceTimer = null;
    let audioQueue = [];
    let isPlayingAudio = false;
    let currentAudio = null;  // track playing Audio object so we can pause it on barge-in
    let streamingEl = null;

    // Barge-in thresholds
    const SILENCE_THRESHOLD = 0.008;       // normal VAD threshold
    const BARGE_IN_THRESHOLD_MIN = 0.015;  // floor: always at least this high during TTS
    let dynamicBargeInThreshold = 0.022;   // updated after sampling TTS bleed-through
    let baselineSamples = [];              // RMS samples collected during TTS playback
    const BASELINE_SAMPLE_COUNT = 5;       // ~1.3s at 4096/16kHz per callback

    let bargedIn = false;  // true after a barge-in fires, suppresses duplicate stream_audio_end

    const SILENCE_DURATION = 700;
    const VOL_BAR_COUNT = 12;

    // ===== INIT =====
    const usernameInput = document.getElementById('username-input');
    const saved = localStorage.getItem('artha_user');
    if (saved) usernameInput.value = saved;

    // Build volume bars
    const volBarsEl = document.getElementById('vol-bars');
    for (let i = 0; i < VOL_BAR_COUNT; i++) {
      const bar = document.createElement('div');
      bar.className = 'vol-bar';
      bar.style.height = '4px';
      volBarsEl.appendChild(bar);
    }

    usernameInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('btn-text').click();
    });

    // ===== SCREEN NAV =====
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function toggleDashboard() {
      const panel = document.getElementById('dash-panel');
      const overlay = document.getElementById('dash-overlay');
      if (panel) panel.classList.toggle('open');
      if (overlay) overlay.classList.toggle('open');
    }

    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    // ===== SESSION START =====
    function startSession(mode) {
      userId = usernameInput.value.trim().replace(/[^a-zA-Z0-9_-]/g, '');
      if (!userId) {
        document.getElementById('landing-err').textContent = 'enter a username first';
        usernameInput.focus();
        return;
      }
      localStorage.setItem('artha_user', userId);
      sessionMode = mode;

      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}/ws/${userId}`);
      ws.onopen = () => {
        ws.send(JSON.stringify({ type: 'session_start', mode }));
        if (mode === 'mic') {
          showScreen('call');
          document.getElementById('call-user').textContent = userId;
          startMic();
        } else {
          showScreen('chat');
          document.getElementById('dash-panel').classList.add('open');
        }
      };
      ws.onclose = () => { toast('Connection closed'); cleanup(); };
      ws.onerror = () => toast('Connection error');
      ws.onmessage = e => handleMsg(JSON.parse(e.data));
    }

    // ===== END SESSION =====
    function endSession() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'end_session' }));
      }
      cleanup();
      showScreen('landing');
    }

    function cleanup() {
      stopMic();
      audioQueue = [];
      isPlayingAudio = false;
      currentAudio = null;
      streamingEl = null;
      if (ws) { try { ws.close(); } catch (e) { } ws = null; }
      document.getElementById('call-transcript').innerHTML = '';
      document.getElementById('chat-messages').innerHTML = '';
    }

    // ===== MIC + VAD =====
    async function startMic() {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
        micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, sampleRate: 16000 } });
        const source = audioCtx.createMediaStreamSource(micStream);
        scriptNode = audioCtx.createScriptProcessor(4096, 1, 1);

        let speaking = false;
        let chunks = [];

        scriptNode.onaudioprocess = e => {
          const data = e.inputBuffer.getChannelData(0);
          let sum = 0;
          for (let i = 0; i < data.length; i++) sum += data[i] * data[i];
          const rms = Math.sqrt(sum / data.length);

          updateVolBars(rms);
          if (typeof updateRMS === 'function') updateRMS(rms);

          // During TTS: collect RMS samples to build a dynamic baseline of TTS bleed-through.
          // Once we have enough samples, threshold = max(mean * 2.5, floor).
          // This adapts: headphones have near-zero bleed, laptop speakers have more.
          if (isPlayingAudio) {
            if (baselineSamples.length < BASELINE_SAMPLE_COUNT) {
              baselineSamples.push(rms);
              if (baselineSamples.length === BASELINE_SAMPLE_COUNT) {
                const mean = baselineSamples.reduce((a, b) => a + b, 0) / BASELINE_SAMPLE_COUNT;
                dynamicBargeInThreshold = Math.max(mean * 2.5, BARGE_IN_THRESHOLD_MIN);
                console.log(`[VAD] dynamic barge-in threshold: ${dynamicBargeInThreshold.toFixed(4)} (bleed mean: ${mean.toFixed(4)})`);
              }
            }
          }

          // While TTS is playing, only fire on a much louder barge-in signal.
          const threshold = isPlayingAudio ? dynamicBargeInThreshold : SILENCE_THRESHOLD;

          if (rms > threshold) {
            if (isPlayingAudio) {
              // User interrupted — stop TTS immediately
              bargeIn();
            }

            if (!speaking) {
              speaking = true;
              bargedIn = false;  // reset for this new recording window
              ws.send(JSON.stringify({ type: 'stream_audio_start', sampleRate: audioCtx.sampleRate }));
              setOrbState('listening');
              document.getElementById('call-status').textContent = 'listening...';
            }
            clearTimeout(silenceTimer);
            silenceTimer = null;

            // Convert float32 to int16 and send
            const int16 = new Int16Array(data.length);
            for (let i = 0; i < data.length; i++) {
              const s = Math.max(-1, Math.min(1, data[i]));
              int16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
            }
            const b64 = arrayBufferToBase64(int16.buffer);
            ws.send(JSON.stringify({ type: 'stream_audio_chunk', data: b64 }));

          } else if (speaking) {
            if (!silenceTimer) {
              silenceTimer = setTimeout(() => {
                speaking = false;
                // Don't send stream_audio_end if this window was already handled by a barge-in
                if (!bargedIn) {
                  ws.send(JSON.stringify({ type: 'stream_audio_end' }));
                  setOrbState('thinking');
                  document.getElementById('call-status').textContent = 'thinking...';
                }
                silenceTimer = null;
              }, SILENCE_DURATION);
            }
          }
        };

        source.connect(scriptNode);
        scriptNode.connect(audioCtx.destination);
        isRecording = true;
        setOrbState('idle');
        document.getElementById('call-status').textContent = 'ready — speak anytime';
      } catch (err) {
        toast('Mic access denied — check browser permissions');
        console.error('[Mic]', err);
      }
    }

    // Barge-in: user spoke while bot was talking — stop TTS immediately
    function bargeIn() {
      if (!isPlayingAudio) return;
      // Pause currently playing audio
      if (currentAudio) {
        try { currentAudio.pause(); } catch (e) { }
        currentAudio = null;
      }
      // Clear pending queue
      audioQueue = [];
      isPlayingAudio = false;
      bargedIn = true;  // suppress any pending silence timer stream_audio_end
      // Reset dynamic baseline for next TTS
      baselineSamples = [];
      dynamicBargeInThreshold = 0.022;
      // Tell server so it can cancel any in-flight TTS generation
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'barge_in' }));
      }
      setOrbState('listening');
      document.getElementById('call-status').textContent = 'listening...';
    }

    function stopMic() {
      isRecording = false;
      clearTimeout(silenceTimer);
      if (scriptNode) { try { scriptNode.disconnect(); } catch (e) { } scriptNode = null; }
      if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
      if (audioCtx) { try { audioCtx.close(); } catch (e) { } audioCtx = null; }
    }

    function updateVolBars(rms) {
      const bars = volBarsEl.children;
      const level = Math.min(rms * 12, 1);
      for (let i = 0; i < bars.length; i++) {
        const dist = Math.abs(i - bars.length / 2) / (bars.length / 2);
        const h = Math.max(4, level * (1 - dist * 0.6) * 24);
        bars[i].style.height = h + 'px';
        bars[i].style.opacity = 0.3 + level * 0.7;
      }
    }

    const face = document.getElementById('face');
    const eyeL = document.getElementById('eye-l');
    const eyeR = document.getElementById('eye-r');
    const irisL = document.getElementById('iris-l');
    const irisR = document.getElementById('iris-r');
    const lidL = document.getElementById('lid-l');
    const lidR = document.getElementById('lid-r');
    const smile = document.getElementById('smile');
    const waveL = document.getElementById('wave-l');
    const waveR = document.getElementById('wave-r');
    const eyesRow = document.getElementById('eyes-row');

    let faceState = 'idle';
    let blinkTimer = null;

    function resetFace() {
      if (!face) return;
      face.style.animation = '';
      eyeL.style.animation = eyeR.style.animation = '';
      irisL.style.animation = irisR.style.animation = '';
      eyeL.style.width = eyeR.style.width = '96px';
      eyeL.style.height = eyeR.style.height = '96px';
      lidL.style.height = lidR.style.height = '0';
      irisL.style.transform = irisR.style.transform = 'translate(-50%,-50%)';
      smile.classList.remove('visible');
      waveL.classList.remove('active');
      waveR.classList.remove('active');
      eyesRow.style.marginBottom = '14px';
      clearTimeout(blinkTimer);
    }

    function blinkFace(cb) {
      lidL.style.height = lidR.style.height = '52%';
      setTimeout(() => {
        lidL.style.height = lidR.style.height = '0';
        if (cb) cb();
      }, 130);
    }

    function scheduleBlink() {
      blinkTimer = setTimeout(() => {
        if (faceState === 'idle' || faceState === 'listening' || faceState === 'speaking') {
          blinkFace(() => scheduleBlink());
        }
      }, 2200 + Math.random() * 2800);
    }

    function movePupils(dx, dy) {
      const t = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
      irisL.style.transform = t;
      irisR.style.transform = t;
    }

    window.updateRMS = function (rms) {
      if (faceState !== 'listening') return;
      const val = Math.min(rms * 15, 1);
      movePupils(0, val * 8 - 4);
    }

    function setOrbState(s) {
      faceState = s;
      resetFace();
      if (!face) return;

      if (s === 'idle') {
        face.style.animation = 'breathe 4s ease-in-out infinite';
        scheduleBlink();
      }

      if (s === 'listening') {
        eyeL.style.width = eyeR.style.width = '106px';
        eyeL.style.height = eyeR.style.height = '106px';
        waveL.classList.add('active');
        waveR.classList.add('active');
        scheduleBlink();
      }

      if (s === 'thinking') {
        movePupils(-10, -12);
        lidR.style.height = '40%';
        face.style.animation = 'breathe 2s ease-in-out infinite';
      }

      if (s === 'speaking') {
        irisL.style.animation = 'spk-bounce .38s ease-in-out infinite alternate';
        irisR.style.animation = 'spk-bounce .38s ease-in-out infinite alternate';
        eyeL.style.height = eyeR.style.height = '88px';
        eyesRow.style.marginBottom = '10px';
        smile.classList.add('visible');
        scheduleBlink();
      }

      if (s === 'barge-in') {
        eyeL.style.animation = 'pop .45s ease forwards';
        eyeR.style.animation = 'pop .45s ease forwards';
        waveL.classList.add('active');
        waveR.classList.add('active');
        setTimeout(() => { if (faceState === 'barge-in') setOrbState('listening'); }, 480);
      }
    }

    function arrayBufferToBase64(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = '';
      for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      return btoa(binary);
    }

    // ===== TEXT CHAT =====
    const chatInput = document.getElementById('chat-input');
    chatInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); }
    });

    function sendText() {
      const val = chatInput.value.trim();
      if (!val || !ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ type: 'text', content: val }));
      chatInput.value = '';
    }

    function addChatMsg(role, text) {
      const container = document.getElementById('chat-messages');
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      div.textContent = text;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
      return div;
    }

    function addCallMsg(role, text) {
      const container = document.getElementById('call-transcript');
      const div = document.createElement('div');
      div.className = 'ct-msg ' + role;
      div.innerHTML = `<div class="ct-label">${role}</div>${text}`;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    // ===== AUDIO PLAYBACK (ORDERED QUEUE) =====
    function queueAudio(b64, index) {
      audioQueue.push({ b64, index });
      audioQueue.sort((a, b) => a.index - b.index);
      playNext();
    }

    function playNext() {
      if (isPlayingAudio || audioQueue.length === 0) {
        // Queue drained — orb back to idle, reset baseline for next TTS session
        if (!isPlayingAudio && audioQueue.length === 0 && sessionMode === 'mic') {
          baselineSamples = [];  // next TTS will re-sample
          setOrbState('idle');
          document.getElementById('call-status').textContent = 'ready — speak anytime';
        }
        return;
      }
      isPlayingAudio = true;
      const item = audioQueue.shift();

      const raw = atob(item.b64);
      const arr = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);

      const blob = new Blob([arr], { type: 'audio/wav' });
      const url = URL.createObjectURL(blob);
      const audio = new Audio(url);
      currentAudio = audio;

      audio.onended = () => {
        URL.revokeObjectURL(url);
        currentAudio = null;
        isPlayingAudio = false;
        playNext();
      };
      audio.onerror = () => {
        currentAudio = null;
        isPlayingAudio = false;
        playNext();
      };
      audio.play().catch(() => { currentAudio = null; isPlayingAudio = false; playNext(); });

      if (sessionMode === 'mic') setOrbState('speaking');
    }

    // ===== WS MESSAGE HANDLER =====
    function handleMsg(msg) {
      switch (msg.type) {
        case 'audio':
          if (sessionMode === 'mic') {
            addCallMsg('assistant', msg.text);
            queueAudio(msg.data, 0);
          } else {
            addChatMsg('assistant', msg.text);
            queueAudio(msg.data, 0);
          }
          break;

        case 'text_only':
          if (sessionMode === 'mic') {
            addCallMsg('assistant', msg.text);
            document.getElementById('call-status').textContent = 'ready — speak anytime';
            setOrbState('idle');
          } else {
            addChatMsg('assistant', msg.text);
          }
          break;

        case 'transcript':
          if (sessionMode === 'mic') {
            addCallMsg('user', msg.text);
          } else {
            addChatMsg('user', msg.text);
          }
          break;

        case 'status':
          if (sessionMode === 'mic') {
            document.getElementById('call-status').textContent = msg.state + '...';
            if (msg.state === 'thinking') setOrbState('thinking');
          }
          break;

        case 'decision':
          break;

        case 'stream_text':
          if (sessionMode === 'text') {
            if (!streamingEl) {
              streamingEl = addChatMsg('assistant', '');
              streamingEl.classList.add('streaming');
            }
            streamingEl.textContent += msg.text;
            document.getElementById('chat-messages').scrollTop = document.getElementById('chat-messages').scrollHeight;
          } else {
            // In mic mode, accumulate for transcript display
            if (!streamingEl) {
              streamingEl = document.createElement('div');
              streamingEl.className = 'ct-msg assistant';
              streamingEl.innerHTML = '<div class="ct-label">assistant</div>';
              document.getElementById('call-transcript').appendChild(streamingEl);
            }
            streamingEl.textContent += msg.text;
          }
          break;

        case 'stream_audio':
          queueAudio(msg.data, msg.index);
          break;

        case 'stream_audio_fallback':
          break;

        case 'stream_end':
          if (streamingEl) {
            streamingEl.classList.remove('streaming');
            streamingEl = null;
          }
          if (sessionMode === 'mic' && audioQueue.length === 0 && !isPlayingAudio) {
            setOrbState('idle');
            document.getElementById('call-status').textContent = 'ready — speak anytime';
          }
          break;

        case 'dashboard_update':
          updateDash(msg.data);
          break;

        case 'session_ended':
          toast('Session saved');
          cleanup();
          showScreen('landing');
          break;

        case 'error':
          toast(msg.text);
          if (sessionMode === 'mic') {
            setOrbState('idle');
            document.getElementById('call-status').textContent = 'ready — speak anytime';
          }
          break;
      }
    }

    // ===== DASHBOARD =====
    function updateDash(d) {
      document.getElementById('dash-income').textContent = '₹' + fmt(d.total_income);
      document.getElementById('dash-expense').textContent = '₹' + fmt(d.total_expense);

      const rate = d.savings_rate || 0;
      document.getElementById('savings-label').textContent = rate + '%';
      const circ = 213.6;
      document.getElementById('savings-fill').style.strokeDashoffset = circ - (circ * Math.min(rate, 100) / 100);

      const cats = d.by_category || {};
      const maxCat = Math.max(...Object.values(cats), 1);
      const catsEl = document.getElementById('dash-cats');
      catsEl.innerHTML = '';
      for (const [cat, amt] of Object.entries(cats)) {
        const pct = (amt / maxCat * 100).toFixed(0);
        catsEl.innerHTML += `<div class="dash-bar-item"><div class="dash-bar-name">${cat}</div><div class="dash-bar"><div class="dash-bar-fill" style="width:${pct}%"></div></div><div class="dash-bar-amt">₹${fmt(amt)}</div></div>`;
      }

      const txEl = document.getElementById('dash-tx');
      txEl.innerHTML = '';
      for (const tx of (d.recent_tx || []).slice(-6).reverse()) {
        txEl.innerHTML += `<div class="tx-item"><span class="tx-cat">${tx.category}</span><span class="tx-amt">₹${Math.abs(tx.amount)}</span></div>`;
      }

      // Show dashboard panel on first update
      document.getElementById('dash-panel').classList.add('open');
    }

    function fmt(n) {
      if (!n) return '0';
      return Number(n).toLocaleString('en-IN', { maximumFractionDigits: 0 });
    }

    // Fetch dashboard on load (for returning users)
    window.addEventListener('load', () => {
      const u = localStorage.getItem('artha_user');
      if (u) {
        fetch(`/api/dashboard?user_id=${u}`)
          .then(r => r.json())
          .then(d => { if (!d.error) updateDash(d); })
          .catch(() => { });
      }
    });
  </script>
</body>
